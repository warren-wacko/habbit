name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # placeholders: the Prisma config and the web build expect these to exist.
      # The API tests never use DATABASE_URL: they use TEST_DATABASE_URL, below.
      DATABASE_URL: postgresql://user:password@localhost:5432/habbit
      NEXT_PUBLIC_API_URL: http://localhost:5000
      # an empty database that exists only for this run, started just below
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/habbit_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: habbit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      # the web tests use the tsx that lives in api/node_modules
      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: API, build the Prisma client
        working-directory: api
        run: npx prisma generate --config prisma7.config.ts

      - name: API, type-check (the app and its tests)
        working-directory: api
        run: npm run typecheck

      - name: API, unit tests
        working-directory: api
        run: npm test

      - name: API, build the tables in the test database
        working-directory: api
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: npx prisma migrate deploy --config prisma7.config.ts

      - name: API, tests against the database
        working-directory: api
        run: npm run test:api

      - name: Web, type-check
        working-directory: web
        run: npx tsc --noEmit

      - name: Web, lint
        working-directory: web
        run: npm run lint

      - name: Web, tests
        working-directory: web
        run: npm test

      - name: Web, production build
        working-directory: web
        run: npm run build
